name: Verify invocation axis

# Executable gate for the invocation axis (see docs/invocation-policy.md).
# Ensures every skill is user-invoked or model-invoked with both marks in
# lockstep, that every agents/openai.yaml exists, that user-invoked descriptions
# have no model trigger, and that the marks survive the installer copy.

on:
  push:
    paths:
      - 'agents/**'
      - 'scripts/verify-invocation.py'
      - 'scripts/test-installer-transport.mjs'
      - '.github/workflows/verify-invocation.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'scripts/verify-invocation.py'
      - 'scripts/test-installer-transport.mjs'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify invocation axis
        run: python3 scripts/verify-invocation.py
      - name: Installer transport smoke test
        run: node scripts/test-installer-transport.mjs
